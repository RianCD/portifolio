<Typing W={x.words}/>
<p className="lead">{x.lead}</p>
<div className="btns"><button className="btn p" onClick={()=>run("#contato")}>{x.talk}</button><a className="btn" href={LI} target="_blank" rel="noopener noreferrer">LinkedIn</a><a className="btn" href={GH} target="_blank" rel="noopener noreferrer">GitHub</a><button className="btn" onClick={copy}>{x.copy}</button><button className="btn" onClick={()=>setTerm(true)}>&gt;_ terminal</button></div>
</section>
<section style={{paddingTop:30}}><h2><span>//</span>{lang==="pt"?"Como eu construo":"How I build"} <small style={{color:"var(--mu)",fontSize:13,fontWeight:400}}>{lang==="pt"?"clique em cada etapa":"click each step"}</small></h2><Flow lang={lang}/></section>

<section id="experiencia"><h2><span>01</span>{x.h[0]}</h2><div className="tl">{ex.map((e,k)=><TItem key={k} e={e} i={k}/>)}</div></section>
<section id="skills"><h2><span>02</span>{x.h[1]}</h2>
<div className="chips">{GROUPS.map(k=><button key={k} className={"chip"+(g===k?" on":"")} onClick={()=>setG(k)}>{x.g[k]}</button>)}</div>
<div className="sk">{list.map(s=><div className="s" key={s.n} onMouseEnter={()=>setHov(s.n)} onMouseLeave={()=>setHov(null)}><b>{s.n}</b><div><i style={{width:s.l+"%"}}/></div><span>{hov===s.n?s.u.split("|")[i]:x.g[s.g]+" · "+s.l+"%"}</span></div>)}</div>
<p style={{color:"var(--mu)",fontSize:13,marginTop:14}}>{x.langs}</p>
<h3 className="sh">{lang==="pt"?"Radar de skills":"Skills radar"}</h3><Radar lang={lang} g={g} setG={setG}/>
<h3 className="sh">{lang==="pt"?"Código que eu escrevo":"Code I write"}</h3><CodeCard/></section>
<section id="projetos"><h2><span>03</span>{x.h[2]}</h2><div className="cards">{pj.map(p=><Card key={p.n} p={p}/>)}</div></section>
<section className="contact" id="contato"><h2><span>04</span>{x.h[3]}</h2><p className="lead" style={{margin:"0 auto 22px"}}>{x.cl}</p>
<div className="btns"><button className="btn p" onClick={copy}>{EMAIL}</button><a className="btn" href={LI} target="_blank" rel="noopener noreferrer">LinkedIn</a><a className="btn" href={WA} target="_blank" rel="noopener noreferrer">WhatsApp</a><a className="btn" href={GH} target="_blank" rel="noopener noreferrer">GitHub</a></div></section>
</main>
<footer>{x.foot}</footer>
{pal&&<Palette close={()=>setPal(false)} run={run} tx={x}/>}{term&&<Terminal close={()=>setTerm(false)} tx={{...x,C:TC(lang)}}/>}
